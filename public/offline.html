<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#2D5795">
    <title>Sin conexión · Postobón</title>
    <style>
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font: 16px/1.6 system-ui, sans-serif; }
        main { margin: 24px; max-width: 420px; padding: 32px; background: white; border: 1px solid #e2e8f0; border-radius: 16px; }
        .brand { color: #2d5795; font-weight: 700; }
        h1 { font-size: 26px; line-height: 1.2; }
        p { color: #475569; }
        a { display: inline-block; margin-top: 12px; padding: 10px 18px; border-radius: 8px; color: white; background: #2d5795; font-weight: 600; text-decoration: none; }
        a:focus-visible { outline: 3px solid #0284c7; outline-offset: 4px; }
    </style>
</head>
<body>
    <main>
        <span class="brand">Postobón · Ventiladores</span>
        <h1>Sin conexión a internet</h1>
        <p>Conéctate para consultar los dispositivos y administrar tus campañas. Los controles necesitan conexión.</p>
        <a href="/dashboard">Volver a intentar</a>
    </main>
</body>
</html>
